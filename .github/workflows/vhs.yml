name: VHS

on:
  push:
    paths:
      - 'demo.tape'
      - 'internal/ui/**'
      - 'cmd/0x53/**'
  workflow_dispatch:

concurrency:
  group: vhs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd unzip fontconfig
          curl -fL "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.2.1/JetBrainsMono.zip" -o /tmp/JetBrainsMono.zip
          unzip -o /tmp/JetBrainsMono.zip -d ~/.local/share/fonts/JetBrainsMono
          fc-cache -fv

      - name: Install VHS
        run: go install github.com/charmbracelet/vhs@latest

      - name: Generate GIF
        timeout-minutes: 10
        env:
          ROD_BROWSER_PATH: /usr/bin/google-chrome-stable
        run: vhs demo.tape

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/tui-demo.gif
          git commit -m "docs(vhs): update demo assets [skip ci]" || echo "No changes to commit"
          git push
